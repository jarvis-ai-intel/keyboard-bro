# =====================================================================
#  Fabrique Keyboard Bro automatiquement, à chaque envoi de code sur GitHub.
#  Résultat : onglet « Actions » du dépôt → dernière exécution → « Artifacts » (en bas).
#  Le numéro de version (src-tauri/tauri.conf.json) est dans le nom de chaque fichier,
#  ex. KeyboardBro-0.4.0-portable-Windows-x64.exe
#   - Windows x64   : version portable (.exe seul) + installateur
#   - Windows ARM64 : version portable (.exe seul) + installateur
#   - Mac (puces Apple) : application en .zip (non signée : clic droit › Ouvrir la 1re fois)
# =====================================================================
name: Fabriquer Keyboard Bro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fabriquer:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Windows-ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: Mac-puces-Apple
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Lire le numéro de version
        id: version
        shell: bash
        run: echo "v=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Installer l'outil Tauri
        run: npm install

      - name: Compiler
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Rassembler les fichiers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $release = "src-tauri/target/${{ matrix.target }}/release"
          $exe = Get-ChildItem "$release/*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "out/KeyboardBro-${{ steps.version.outputs.v }}-portable-${{ matrix.name }}.exe"
          $setup = Get-ChildItem "$release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "out/KeyboardBro-${{ steps.version.outputs.v }}-installateur-${{ matrix.name }}.exe"
          Get-ChildItem out

      - name: Rassembler les fichiers (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ditto -c -k --keepParent "Keyboard Bro.app" "$GITHUB_WORKSPACE/out/KeyboardBro-${{ steps.version.outputs.v }}-${{ matrix.name }}.zip"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v6
        with:
          name: KeyboardBro-${{ steps.version.outputs.v }}-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
